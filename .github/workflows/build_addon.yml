name: Build addon

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install lint dependencies
        run: uv sync --only-group lint
      - name: Run ruff lint
        run: uv run ruff check navsounds/ tests/
      - name: Run ruff format check
        run: uv run ruff format --check navsounds/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --only-group test
      - name: Run tests
        run: uv run pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Read manifest and build addon
        id: build
        run: |
          # NVDA add-on manifests have no INI section header; inject one so
          # configparser can parse them.
          read_field() {
            python3 -c "
import configparser, sys
c = configparser.ConfigParser()
c.read_string('[DEFAULT]\n' + open(sys.argv[1], encoding='utf-8-sig').read())
print(c['DEFAULT'][sys.argv[2]])
" "$1" "$2"
          }
          name=$(read_field navsounds/manifest.ini name)
          version=$(read_field navsounds/manifest.ini version)
          addon_name="${name,,}_v${version}.nvda-addon"
          echo "addon_name=${addon_name}" >> "$GITHUB_OUTPUT"
          cd navsounds
          zip -r "../${addon_name}" ./* -x '*.pyc' '*__pycache__*' '*.pytest_cache*' '.git*'
          cd ..
          sha256sum "${addon_name}" > "${addon_name}.sha256sum"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: navSounds-addon
          path: |
            *.nvda-addon
            *.sha256sum

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: navSounds-addon
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.nvda-addon
            *.sha256sum
