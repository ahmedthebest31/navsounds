name: Build addon

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install lint dependencies
        run: uv sync --only-group lint
      - name: Run ruff lint
        run: uv run ruff check navsounds/ tests/
      - name: Run ruff format check
        run: uv run ruff format --check navsounds/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --only-group test
      - name: Run tests
        run: uv run pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Package addon
        run: |
          cd navsounds
          zip -r ../navSounds-${{ github.ref_name }}.nvda-addon ./* -x '*.pyc' '*__pycache__*' '*.pytest_cache*' '.git*'
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: navSounds-addon
          path: ./*.nvda-addon

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: navSounds-addon
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./*.nvda-addon
