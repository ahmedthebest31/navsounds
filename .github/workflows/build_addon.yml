name: Build addon

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --only-group lint
      - name: Run ruff lint
        run: uv run ruff check navsounds/ tests/
      - name: Run ruff format check
        run: uv run ruff format --check navsounds/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Package addon
        run: |
          cd navsounds
          zip -r ../navSounds-${{ github.ref_name }}.nvda-addon ./*
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: navSounds-addon
          path: ./*.nvda-addon

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: navSounds-addon
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.nvda-addon
